# Egress allowlist for the copilot-cli sandbox, matched as regex against
# each request's hostname (FilterExtended). Add a line and rebuild
# (`make build`) to open up another destination.
#
# GitHub Copilot allowlist reference:
# https://docs.github.com/en/copilot/reference/copilot-allowlist-reference

# GitHub, listed host by host rather than by wildcard so subdomains that
# aren't needed (gist.github.com, uploads.github.com release uploads, ...)
# stay closed. The proxy only sees hostnames, so this can't restrict which
# account, org, or repo a request targets.
^github\.com$
^api\.github\.com$
^codeload\.github\.com$
^collector\.github\.com$
^cli\.github\.com$
^github\.githubassets\.com$

# Raw files, release downloads, and Git LFS objects
^raw\.githubusercontent\.com$
^objects\.githubusercontent\.com$
^release-assets\.githubusercontent\.com$
^media\.githubusercontent\.com$

# Copilot endpoints served from githubusercontent.com
^copilot-proxy\.githubusercontent\.com$
^origin-tracker\.githubusercontent\.com$
^copilot-telemetry\.githubusercontent\.com$

# Copilot suggestion/chat API, telemetry, experimentation
(^|\.)githubcopilot\.com$
(^|\.)exp-tas\.com$

# npm registry (copilot CLI / node tooling installs and self-updates)
(^|\.)npmjs\.org$
(^|\.)npmjs\.com$

# Ubuntu package mirrors (apt-get inside the running container)
(^|\.)ubuntu\.com$

# For Codex
(^|\.)openai\.com$
(^|\.)chatgpt\.com$
(^|\.)oaistatic\.com$
(^|\.)oaiusercontent\.com$
(^|\.)oaistatsig\.com$

# For Claude
^api\.anthropic\.com$
^platform\.claude\.com$
(^|\.)claude\.(ai|com)$
(^|\.)claudeusercontent\.com$