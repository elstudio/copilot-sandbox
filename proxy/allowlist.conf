# Egress allowlist for the copilot-cli sandbox, matched as regex against
# each request's hostname (FilterExtended). Add a line and rebuild
# (`make build`) to open up another destination.
#
# GitHub Copilot allowlist reference:
# https://docs.github.com/en/copilot/reference/copilot-allowlist-reference

# GitHub: auth, API, git over HTTPS, releases, raw content
(^|\.)github\.com$
(^|\.)githubusercontent\.com$
(^|\.)githubassets\.com$
^cli\.github\.com/packages$

# Copilot suggestion/chat API, telemetry, experimentation
(^|\.)githubcopilot\.com$
(^|\.)exp-tas\.com$

# npm registry (copilot CLI / node tooling installs and self-updates)
(^|\.)npmjs\.org$
(^|\.)npmjs\.com$

# Ubuntu package mirrors (apt-get inside the running container)
(^|\.)ubuntu\.com$
^ports\.ubuntu\.com$