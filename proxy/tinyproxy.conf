User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
DisableViaHeader Yes
LogLevel Info

# This proxy is only ever reachable over the internal (no-NAT) sandbox
# network, never published to the host, so this just guards against a
# misconfigured network attachment.
Allow 192.168.0.0/16
Allow 127.0.0.1

Filter "/etc/tinyproxy/allowlist.conf"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No
