name: copilot-sandbox
services:
  proxy:
    build:
      context: ./proxy
    image: copilot-proxy
    container_name: copilot-proxy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: 2
        reservations:
          memory: 512m
          cpus: '0.5'
          

  copilot-cli:
    build:
      context: .
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        NO_PROXY: "localhost,127.0.0.1"
      ssh: 
        - default
    container_name: copilot-cli
    init: true
    # DNS for the running container. Keep in sync with the Makefile's
    # BUILDER_DNS (default 1.1.1.1), which fixes DNS for the image *builder*.
    # NOTE: the current `container-compose` does not yet honor this `dns:` key,
    # so it has no effect today — it's standard Compose syntax kept here for
    # documentation and forward-compatibility (real Docker / future tooling).
    dns:
      - 1.1.1.1
    # Runtime networking (attaching to the internal, no-NAT network behind
    # `proxy`, so only allowlisted domains are reachable) is orchestrated by
    # the Makefile's `up` target via raw `container run`, not by this compose
    # file — `container-compose` doesn't yet support the multi-network
    # attachment this setup needs. This file is only used to build images
    # (`make build` -> `container-compose build`). See `proxy/allowlist.conf`.
    ports:
      - "127.0.0.1:2222:22"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: 2
        reservations:
          memory: 512m
          cpus: '0.5'
    volumes:
      # Mount the auto-generated SSH public key for auth
      - ./.ssh/copilot-sandbox.pub:/tmp/authorized_keys:ro
      - ~/code/sandbox:/home/dev/code
